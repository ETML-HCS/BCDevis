name: Publier BCDevis Web pour iPad

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Vérifier et préparer la PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configurer la sandbox Electron sous Linux
        run: |
          electron_path="$(node -p "require('electron')")"
          sandbox_path="$(dirname "${electron_path}")/chrome-sandbox"
          test -f "${sandbox_path}"
          sudo chown root:root "${sandbox_path}"
          sudo chmod 4755 "${sandbox_path}"
      - name: Vérifier et assembler la version web
        run: xvfb-run -a npm run chromeos
      - name: Préparer le site GitHub Pages
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          source="devis-portable/dist/chromeos/BCDevis-${version}-ChromeOS/site"
          test -f "${source}/index.html"
          mkdir -p _site
          cp -a "${source}/." _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publier sur GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
