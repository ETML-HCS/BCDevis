name: Validation BCDevis

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tests locaux et PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bcdevis_test
          POSTGRES_USER: bcdevis_test
          POSTGRES_PASSWORD: bcdevis-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bcdevis_test -d bcdevis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BCDEVIS_TEST_DATABASE_URL: postgresql://bcdevis_test:bcdevis-test-password@127.0.0.1:5432/bcdevis_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configurer la sandbox Electron sous Linux
        run: |
          node -e "require('electron')"
          electron_path="$(node -p "require('electron')")"
          sandbox_path="$(dirname "${electron_path}")/chrome-sandbox"
          test -f "${sandbox_path}"
          sudo chown root:root "${sandbox_path}"
          sudo chmod 4755 "${sandbox_path}"
      - run: xvfb-run -a npm run check:ci
